name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller flet flet-desktop flet-web requests certifi

      - name: Build EXE with PyInstaller
        run: |
          $CERT_PATH = python -c "import certifi; print(certifi.where())"
          pyinstaller --onefile --windowed --name "BatchRepay" `
            --collect-all flet `
            --collect-all flet_desktop `
            --collect-all flet_web `
            --hidden-import flet.desktop `
            --hidden-import flet_desktop `
            --hidden-import flet_web `
            --copy-metadata flet `
            --copy-metadata flet-desktop `
            --copy-metadata flet-web `
            --add-data "$CERT_PATH;certifi" `
            batch_repay_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatchRepay-Windows
          path: dist/BatchRepay.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BatchRepay.exe
